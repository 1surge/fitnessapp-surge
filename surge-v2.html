/* ---------------- storage choice: device or your own cloud ---------------- */
function folderSupported(){ return typeof window.showDirectoryPicker==='function'; }
function storagePersisted(){ return !!(navigator.storage&&navigator.storage.persisted); }
function persistStorage(){
  if(!navigator.storage||!navigator.storage.persist) return Promise.resolve(false);
  return navigator.storage.persist().catch(()=>false);
}
function friendlyStoreName(){
  if(store.mode!=='folder') return 'this device';
  return store.folderName?'in '+store.folderName:'in your folder';
}
async function idbPut(handle){
  return new Promise((res,rej)=>{
    try{
      const r=indexedDB.open('surge',1);
      r.onupgradeneeded=()=>{ r.result.createObjectStore('store'); };
      r.onsuccess=()=>{ const t=r.result.transaction('store','readwrite'); t.objectStore('store').put(handle,'folder'); t.oncomplete=res; t.onerror=rej; };
      r.onerror=rej;
    }catch(e){ rej(e); }
  });
}
async function idbGet(){
  return new Promise((res)=>{
    try{
      const r=indexedDB.open('surge',1);
      r.onupgradeneeded=()=>{ r.result.createObjectStore('store'); };
      r.onsuccess=()=>{ const t=r.result.transaction('store','readonly'); const q=t.objectStore('store').get('folder'); q.onsuccess=()=>res(q.result||null); q.onerror=()=>res(null); };
      r.onerror=()=>res(null);
    }catch(e){ res(null); }
  });
}
async function pickFolder(){
  if(!folderSupported()){ toast('This browser needs the file option below.'); return; }
  toast('Pick the folder where surge-log.json will live.');
  try{
    const h=await window.showDirectoryPicker({mode:'readwrite'});
    const next={mode:'folder',folderName:h.name||'picked folder'};
    /* Keep the current log authoritative when re-linking a folder. If the picked folder has a newer cloud copy and this device is empty, restore it instead. */
    const previousMode=store.mode;
    const previousHandle=store.handle;
    store.handle=h; store.folderName=next.folderName; store.mode='folder';
    const cloudLog=await readFolderBackup().catch(()=>null);
    const localSets=countSets(S);
    const cloudSets=cloudLog&&cloudLog.sessions?countSets(cloudLog):0;
    const cloudAt=cloudLog&&typeof cloudLog.savedAt==='number'?cloudLog.savedAt:0;
    const deviceSaved=localStorage.getItem(KEY);
    if(cloudLog&&cloudLog.sessions&&(localSets===0&&cloudSets>0||cloudAt>(S&&S.savedAt||0)+1000)){
      S=normalize(cloudLog);
      save();
    }else{
      save();
    }
    store.mode='folder'; store.folderName=next.folderName; store.handle=h;
    await idbPut(h);
    store.mode='folder'; store.folderName=next.folderName; store.handle=h;
    try{ localStorage.setItem('surge.store',JSON.stringify({mode:'folder',folderName:store.folderName,savedAt:S&&S.savedAt||0})); }catch(e){}
    await writeFolderBackup(true);
    render();
  }catch(e){
    /* If permission is denied or picker is dismissed before choosing, keep device mode state. */
    if(!store.handle){ store.mode='device'; }
  }
}
async function writeFolderBackup(loud){
  if(!store.handle) return false;
  if(writing){ writeQueued=true; return true; }
  writing=true;
  try{
    const fh=await store.handle.getFileHandle('surge-log.json',{create:true});
    const data=JSON.stringify(Object.assign({},S,{savedAt:S&&S.savedAt||Date.now()}));
    if(fh.createWritable){
      const w=await fh.createWritable();
      await w.write({type:'write',data});
      await w.close();
    }else{
      throw new Error('no writable handle');
    }
    if(loud) toast('Saved '+friendlyStoreName()+'.');
    dirty=false;
    return true;
  }catch(e){
    if(loud) toast('Could not write to that folder.');
    return false;
  }finally{
    writing=false;
    if(writeQueued){ writeQueued=false; writeFolderBackup(false); }
  }
}
async function readFolderBackup(){
  try{
    if(!store.handle) return null;
    const fh=await store.handle.getFileHandle('surge-log.json',{create:false});
    const f=await fh.getFile();
    return JSON.parse(await f.text());
  }catch(e){ return null; }
}
function countSets(o){
  let n=0;
  try{ Object.values(o.sessions||{}).forEach(s=>Object.values(s.entries||{}).forEach(e=>(e.sets||[]).forEach(x=>{ if(x.done) n++; }))); }catch(e){}
  return n;
}
async function hydrateStore(){
  if(store.mode!=='folder') return;
  const h=await idbGet();
  if(!h) return;
  store.handle=h;
  const d=await readFolderBackup();
  if(d&&d.sessions){
    const deviceSets=countSets(S);
    const cloudSets=countSets(d);
    const cloudAt=typeof d.savedAt==='number'?d.savedAt:0;
    const deviceAt=S&&typeof S.savedAt==='number'?S.savedAt:0;
    /* Restore if the cloud copy is newer; otherwise the fuller local copy lets the folder catch up on the next save. */
    if(cloudSets>0&&(deviceSets===0||cloudAt>deviceAt+1000)){
      S=normalize(d);
      dirty=false;
      save();
    }else if(deviceSets>cloudSets||deviceAt>cloudAt){
      dirty=true;
      await writeFolderBackup(false);
    }
  }
  storeReady=true;
  lastHydratedAt=Date.now();
  persistStorage().catch(()=>false);
  render();
}

function paintLib(){
  const g=document.querySelector('.libgrid');
  if(g){ g.outerHTML=libGridHTML(); return; }
  const e=document.querySelector('.empty');
  if(e&&LIB.q) e.outerHTML=libGridHTML();
}
/* filter chips/tabs swap content in place — never re-render or scroll */
function paintLibFull(){
  const bar=document.querySelector('.libbar');
  const chips=bar&&bar.querySelector('[data-swipe="chips"]');
  const sx=chips?chips.scrollLeft:0;
  const r=route(); if(r!=='library'){ render(); return; }
  const seg=bar&&bar.querySelector('.seg');
  if(seg){
    seg.querySelectorAll('button').forEach(b=>{
      if(b.dataset.act==='lib-tab') b.setAttribute('aria-selected',String(LIB.tab===b.dataset.t));
    });
  }
  if(chips){
    chips.querySelectorAll('.chip').forEach(c=>{
      c.setAttribute('aria-pressed',String((c.dataset.m||'')===LIB.muscle));
    });
  }
  if(LIB.tab==='learn'){
    const panel=document.querySelector('#view .panel.sect');
    const tmp=document.createElement('div'); tmp.innerHTML=learnHTML();
    if(panel) panel.replaceWith(tmp.firstChild);
  } else {
    const sb=document.querySelector('.search');
    if(sb){
      const inp=sb.querySelector('#libQ');
      if(inp){ inp.placeholder=`Search ${LIB.tab==='stretch'?'stretches':'lifts'}`; inp.value=LIB.q||''; }
      const clr=sb.querySelector('[data-act="lib-clear"]');
      if(!LIB.q&&clr) clr.remove();
      if(LIB.q&&!clr){ const b=document.createElement('button'); b.dataset.act='lib-clear'; b.style.cssText='color:var(--muted);font-size:16px'; b.textContent='×'; sb.appendChild(b); }
    }
    paintLib();
  }
  const bar2=document.querySelector('.libbar [data-swipe="chips"]');
  if(bar2) bar2.scrollLeft=sx;
}

/* keep the current station visible when the keyboard opens over the dock */
document.addEventListener('focusin',ev=>{
  const el=ev.target;
  if(el&&(el.id==='inW'||el.id==='inR')){
    setTimeout(()=>{ const st=document.querySelector('.station--live'); if(st) st.scrollIntoView({block:'start'}); },350);
  }
});

/* swiping: lane nudge, sheet dismiss, chips/grid fling */
let laneDrag=null, sheetDrag=null;
document.addEventListener('pointerdown',ev=>{
  if(ev.target.closest('#lane')) laneDrag={x:ev.clientX};
  const sh=ev.target.closest('#sheet.on');
  if(sh&&(ev.target.closest('[data-swipe]')||ev.target.closest('.sheet-grab')||ev.target.closest('.sheet-body'))) sheetDrag={y:ev.clientY,x:ev.clientX,el:sh,moved:false};
  const sw=ev.target.closest('[data-swipe="chips"],[data-swipe="grid"]');
  if(sw&&!sh) sw.dataset.sx=ev.clientX;
});
document.addEventListener('pointermove',ev=>{
  if(laneDrag){ const dx=ev.clientX-laneDrag.x; Lane.nudge(dx/260); return; }
  if(sheetDrag){
    const dy=ev.clientY-sheetDrag.y, dx=Math.abs(ev.clientX-sheetDrag.x);
    if(Math.abs(dy)>12&&Math.abs(dy)>dx*1.4){ sheetDrag.moved=true; sheetDrag.el.style.transform=`translateY(${Math.max(0,dy)}px)`; sheetDrag.el.style.transition='none'; }
    return;
  }
  const sw=ev.target.closest&&ev.target.closest('[data-swipe]');
  if(sw&&sw.dataset.sx!=null){ const dx=ev.clientX-(+sw.dataset.sx); if(Math.abs(dx)>4) sw.scrollLeft-=dx, sw.dataset.sx=ev.clientX; }
});
document.addEventListener('pointerup',ev=>{
  if(laneDrag){ laneDrag=null; Lane.release(); return; }
  if(sheetDrag){
    const sh=sheetDrag, dy=ev.clientY-sh.y; sheetDrag=null;
    sh.el.style.transition=''; sh.el.style.transform='';
    if(sh.moved&&dy>110) closeSheet();
    return;
  }
  document.querySelectorAll('[data-swipe]').forEach(el=>{ delete el.dataset.sx; });
});
document.addEventListener('pointercancel',()=>{
  if(laneDrag){ laneDrag=null; Lane.release(); }
  if(sheetDrag){ sheetDrag.el.style.transition=''; sheetDrag.el.style.transform=''; sheetDrag=null; }
  document.querySelectorAll('[data-swipe]').forEach(el=>{ delete el.dataset.sx; });
});

/* rest timer */
function startRest(sec){
  S.timer={ends:Date.now()+sec*1000,label:'Rest'};
  save(); tickRest();
}
function tickRest(){
  clearInterval(REST_TICK);
  const paint=()=>{
    let el=document.getElementById('restPill');
    const t=S.timer;
    if(!t||t.ends<Date.now()){
      if(el) el.remove();
      S.timer=null; clearInterval(REST_TICK);
      return;
    }
    const left=Math.ceil((t.ends-Date.now())/1000);
    if(!el){
      el=document.createElement('div');
      el.id='restPill'; el.setAttribute('role','status'); el.setAttribute('aria-live','polite');
      el.innerHTML='<span>REST</span><b id="restNum"></b>';
      document.body.appendChild(el);
    }
    const n=document.getElementById('restNum');
    if(n) n.textContent=fmtDur(left*1000);
  };
  paint();
  REST_TICK=setInterval(paint,250);
}

/* auto swap when equipment missing */
function autoSubstitute(sess){
  const d=P[sess.dayId]; if(!d) return;
  sess.autoSwaps=sess.autoSwaps||[];
  d.blocks.forEach(b=>{
    if(!isBlocked(b.ex)) return;
    const alts=((D.alternates&&D.alternates[b.ex])||[]).filter(id=>EX[id]&&!isBlocked(id));
    const same=(D.exercises||[]).find(e=>!isBlocked(e.id)&&(e.primary||[]).some(m=>(EX[b.ex]?.primary||[]).includes(m)));
    const pick=alts[0]||(same&&same.id);
    if(pick){ sess.autoSwaps.push({from:b.ex,to:pick}); b.ex=pick; }
  });
}

/* scroll the tabbar away? keep it simple: it stays. */

/* ---------------- boot ---------------- */
load();
const m=document.querySelector('meta[name="theme-color"]');
if(m) m.content=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#0A0A0C';
if(!location.hash) location.hash='#/today';
window.addEventListener('hashchange',()=>{ closeSheet(); render(); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden) Lane.unmount(); else render(); });
hydrateStore();
render();
</script>
