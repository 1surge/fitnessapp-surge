<style>
/* ============================================================
   SURGE v2 — "the lane"
   Flat signage panels, hairlines, one signal colour,
   oversized condensed numerals, one 3D moment: the track.
   ============================================================ */
:root{
  --ink:#0A0A0C;
  --floor:#0F0F13;
  --panel:#141419;
  --panel2:#1A1A21;
  --chalk:#F4F2EC;
  --muted:#8C8C97;
  --line:#24242D;
  --line2:#33333F;
  --signal:#FF5A1F;
  --signal-ink:#0A0A0C;
  --track:#17171E;
  --trackline:#4A4A58;
  --warn:#FFC46B;
  --r:3px;
  --pad:18px;
  --tabh:64px;
  --disp:'Barlow Condensed','Arial Narrow',Impact,system-ui,sans-serif;
  --ui:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --ease:cubic-bezier(.22,.9,.24,1);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
html[data-theme="light"]{
  --ink:#EFECE4;
  --floor:#E4E0D6;
  --panel:#F7F5EF;
  --panel2:#EDEAE1;
  --chalk:#14140F;
  --muted:#6C6C63;
  --line:#D5D1C5;
  --line2:#C2BDB0;
  --signal:#E2451A;
  --signal-ink:#FFF8F4;
  --track:#DCD7CB;
  --trackline:#9E988A;
  --warn:#9A6512;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,a,input,label,.chip,.wtick{touch-action:manipulation}
html,body{margin:0;padding:0}
html{background:var(--ink);color-scheme:dark}
html[data-theme="light"]{color-scheme:light}
body{
  font-family:var(--ui);
  background:var(--ink);
  color:var(--chalk);
  
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overscroll-behavior-y:none;
  min-height:100vh;
  min-height:100dvh;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left;min-width:0;max-width:100%}
a{color:inherit;text-decoration:none}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.015em;line-height:1.06}
p{margin:0;line-height:1.55}
::selection{background:var(--signal);color:var(--signal-ink)}

/* ---------- type ---------- */
.disp{font-family:var(--disp);font-weight:900;text-transform:uppercase;letter-spacing:.005em;line-height:.86}
.kicker{font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--disp);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:0}
.muted{color:var(--muted)}
.small{font-size:13.5px;line-height:1.5}
.tiny{font-size:11.5px;line-height:1.4}
button.tiny{padding:8px 0}
hr,.hr{height:1px;background:var(--line);border:0;margin:0}

/* ---------- layout ---------- */
#view{max-width:760px;margin:0 auto;padding:0 0 calc(var(--tabh) + var(--safe-b) + 20px)}
body.hasdock #view{padding-bottom:calc(var(--tabh) + var(--safe-b) + 232px)}
.logbtn{
  display:flex;align-items:center;justify-content:center;gap:9px;
  width:100%;height:56px;border-radius:var(--r);background:var(--signal);color:var(--signal-ink);
  font-family:var(--disp);font-weight:900;font-size:20px;letter-spacing:.1em;text-transform:uppercase;
  transition:transform .1s var(--ease),filter .15s;
  box-shadow:0 10px 30px -12px color-mix(in srgb,var(--signal) 70%,transparent);
}
.logbtn:active{transform:translateY(1px) scale(.995);filter:brightness(1.08)}
.logbtn[disabled]{background:var(--panel2);color:var(--muted);box-shadow:none}
body.hasdock #view{padding-bottom:calc(var(--tabh) + var(--safe-b) + 232px)}
.view{animation:viewin .28s var(--ease) both}
@keyframes viewin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pad{padding-left:var(--pad);padding-right:var(--pad)}
.row{display:flex;align-items:center}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack>*+*{margin-top:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.units2{display:flex;gap:8px}
.units2 .btn{flex:1 1 0;min-width:0;padding-left:0;padding-right:0;font-size:10.5px;letter-spacing:.02em}
.grid2 .btn{min-width:0;white-space:normal;line-height:1.3;}

/* ---------- topbar ---------- */
.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(var(--safe-t) + 10px) var(--pad) 10px;
  background:color-mix(in srgb,var(--ink) 88%,transparent);
  backdrop-filter:blur(14px) saturate(1.2);
  -webkit-backdrop-filter:blur(14px) saturate(1.2);
  border-bottom:1px solid var(--line);
}
.wordmark{font-family:var(--disp);font-weight:900;font-size:21px;letter-spacing:.14em;text-transform:uppercase}
.wordmark i{color:var(--signal);font-style:normal}

/* ---------- the lane ---------- */
.lane{
  position:relative;width:100%;height:260px;height:clamp(200px,31vh,286px);height:clamp(200px,31dvh,286px);
  overflow:hidden;background:var(--ink);
  border-bottom:1px solid var(--line);
}
.lane canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;z-index:1}
.lane::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 55%,transparent) 0%,transparent 22%,transparent 62%,var(--ink) 99%);
}
.lane-fallback{position:absolute;inset:0;overflow:hidden;z-index:0;
  background:
    repeating-linear-gradient(90deg,transparent 0 47px,var(--line) 47px 48px),
    radial-gradient(120% 80% at 50% 100%,var(--panel2) 0%,var(--ink) 70%);
  opacity:.5;
}
.lane-hud{position:absolute;inset:0;z-index:2;pointer-events:none;display:flex;flex-direction:column;justify-content:flex-end;padding:0 var(--pad) 13px}
.weekbar{position:relative;z-index:3;padding:11px var(--pad) 9px;background:var(--ink)}
.weekrail{display:flex;gap:6px;align-items:center;pointer-events:auto}
.wtick{flex:1;min-height:44px;position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:3px;cursor:pointer}
.wtick b{display:block;height:3px;background:var(--line2);transition:background .2s var(--ease),height .2s var(--ease)}
.wtick[data-kind="recovery"] b{background:repeating-linear-gradient(90deg,var(--line2) 0 4px,transparent 4px 8px);height:2px}
.wtick span{font-size:9px;font-weight:800;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.wtick[data-state="done"] b{background:var(--chalk);height:4px}
.wtick[data-state="now"] b{background:var(--signal);height:5px;box-shadow:0 0 14px color-mix(in srgb,var(--signal) 60%,transparent)}
.wtick[data-state="now"] span{color:var(--chalk)}
.lane-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.station-no{font-family:var(--disp);font-weight:900;font-size:12.5px;letter-spacing:.19em;color:var(--chalk);text-transform:uppercase;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.station-no em{font-style:normal;color:var(--signal)}
.lane-clock{font-family:var(--disp);font-weight:800;font-size:12.5px;letter-spacing:.1em;color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto}
.lane-clock[data-live="1"]{color:var(--chalk)}
.lane-clock[data-live="1"]::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--signal);margin-right:5px;vertical-align:2px;animation:blip 2s infinite}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.25}}

/* ---------- intro week strip: the week at a glance, no dead hero ---------- */
.weekstrip{padding:16px var(--pad) 6px;border-bottom:1px solid var(--line)}
.weekstrip-row{display:flex;gap:6px;margin-top:10px}
.wcell{flex:1;min-width:0;border:1px solid var(--line2);border-radius:var(--r);padding:9px 4px 8px;text-align:center;background:var(--floor)}
.wcell b{display:block;font-family:var(--disp);font-weight:900;font-size:15px;letter-spacing:.06em}
.wcell span{display:block;font-size:8.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wcell i{display:block;width:14px;height:3px;margin:7px auto 0;background:var(--line2)}
.wcell[data-kind="strength"] i{background:var(--signal)}
.wcell[data-today="1"]{border-color:var(--signal)}
.wcell[data-today="1"] span{color:var(--chalk)}
.sticky-cta{position:sticky;bottom:calc(var(--tabh) + var(--safe-b) + 12px);z-index:5}

/* ---------- panels ---------- */
.panel{background:var(--panel);border-top:1px solid var(--line)}
.panel+.panel{border-top:1px solid var(--line)}
.sect{padding:22px var(--pad)}

.sect--tight{padding:16px var(--pad)}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.head h2{font-family:var(--disp);font-weight:800;text-transform:uppercase;font-size:15px;letter-spacing:.14em;color:var(--muted)}

/* ---------- station ---------- */
.station{padding:18px var(--pad) 16px;position:relative;overflow:hidden}
.station-ghost{position:absolute;right:6px;top:-22px;font-family:var(--disp);font-weight:900;font-size:132px;line-height:1;color:var(--chalk);opacity:.045;pointer-events:none;user-select:none}
.station h1{font-family:var(--disp);font-weight:900;text-transform:uppercase;font-size:clamp(34px,10.4vw,50px);letter-spacing:-.005em;line-height:.88;margin:2px 0 10px;max-width:12ch;text-wrap:balance}
.station--live{padding:14px var(--pad) 12px}
.station--live h1{font-size:clamp(26px,7.8vw,36px);margin:3px 0 8px;line-height:.92}
.station--live .kicker{font-size:10px}
.station--live h1+.station-meta{margin-top:0}
.station-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.tag{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line2);padding:4px 7px;border-radius:2px}
.tag--sig{color:var(--signal);border-color:color-mix(in srgb,var(--signal) 45%,transparent)}
button.tag{padding:8px 10px}

/* ---------- tempo strip (last → now → next) ---------- */
.tempo{display:grid;grid-template-columns:1fr 1fr 1fr;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden;margin:16px var(--pad) 0;background:var(--floor)}
.tempo>div{padding:10px 10px 11px;position:relative;min-width:0}
.tempo>div+div{border-left:1px solid var(--line2)}
.tempo .k{font-size:9px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.tempo .v{font-family:var(--disp);font-weight:900;font-size:23px;line-height:1;margin-top:5px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:clip}
.tempo .u{font-size:9.5px;font-weight:700;color:var(--muted);margin-left:3px;letter-spacing:.04em}
.tempo .now{background:var(--panel2)}
.tempo .now .k{color:var(--signal)}
.tempo .now .v{color:var(--signal)}
.tempo .d{font-size:9.5px;color:var(--muted);margin-top:4px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- set logger ---------- */
.logger{padding:16px var(--pad) 4px}
.setdone{display:flex;align-items:center;gap:9px;padding:7px 8px 7px 0;border-bottom:1px solid var(--line)}
.setdone .i{width:22px;font-family:var(--disp);font-weight:800;font-size:13px;color:var(--muted)}
.setdone .v{font-family:var(--disp);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.setdone .t{font-size:11px;color:var(--muted);margin-left:auto}
.setdone[data-warm="1"] .v{color:var(--muted)}
.setdone .undo{font-size:11px;font-weight:700;color:var(--muted);padding:9px 8px;margin:-9px -8px -9px 4px}
.steppers{display:grid;grid-template-columns:1.15fr 1fr;gap:10px;margin-top:14px}
.stepper{border:1px solid var(--line2);border-radius:var(--r);background:var(--floor);padding:9px 10px 11px}
.stepper .lab{font-size:9px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.stepper .ctl{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:3px}
.stepper .val{font-family:var(--disp);font-weight:900;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;min-width:2ch;text-align:center}
.stepper .val small{font-family:var(--ui);font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.05em;margin-left:2px}
.stepbtn{width:38px;height:38px;flex:0 0 auto;display:grid;place-items:center;border:1px solid var(--line2);border-radius:2px;font-size:19px;font-weight:600;color:var(--chalk);transition:background .12s,border-color .12s}
.stepbtn:active{background:var(--panel2);border-color:var(--chalk)}
.stepper input{width:100%;border:0;background:none;color:var(--chalk);font-family:var(--disp);font-weight:900;font-size:30px;text-align:center;font-variant-numeric:tabular-nums;padding:0;min-width:0;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
/* ---------- dock: the one-thumb logging surface ---------- */
.dock{
  position:fixed;left:0;right:0;bottom:calc(var(--tabh) + var(--safe-b));z-index:45;
  display:none;padding:9px var(--pad) 10px;
  background:var(--panel);border-top:1px solid var(--line2);
  box-shadow:0 -22px 34px -26px #000;
}
.dock.on{display:block}
.dock-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.dock-title{min-width:0;flex:1 1 auto}
.dock-k{font-family:var(--disp);font-weight:900;font-size:15px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock-k em{font-style:normal;color:var(--signal)}
.dock-sub{font-size:11px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.dock-fold{width:44px;height:44px;flex:0 0 auto;display:grid;place-items:center;border:1px solid var(--line2);border-radius:2px;color:var(--muted)}
.dock-fold svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s var(--ease)}
.dock.mini .dock-fold svg{transform:rotate(180deg)}
.dock.mini .steppers{display:none}
@media(min-width:820px){
  .dock{left:50%;right:auto;transform:translateX(-50%);width:760px;max-width:100%;border-left:1px solid var(--line2);border-right:1px solid var(--line2)}
}
.dock .steppers{margin-top:0;gap:8px;grid-template-columns:1.1fr 1fr}
.dock .stepper{padding:7px 8px 8px}
.dock .stepper .ctl{margin-top:1px}
.dock .stepper .val,.dock .stepper input{font-size:26px;min-height:44px}
.dock .stepbtn{width:44px;height:44px;font-size:19px}
.dock .logbtn{height:52px;margin-top:8px;font-size:18.5px}
#restPill{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + var(--safe-b) + 18px);
  z-index:44;background:var(--chalk);color:var(--ink);
  font-family:var(--disp);font-weight:900;font-size:15px;letter-spacing:.1em;
  padding:8px 15px;border-radius:2px;display:flex;gap:9px;align-items:center;
  transition:bottom .2s var(--ease);
}
body.hasdock #restPill{bottom:calc(var(--tabh) + var(--safe-b) + 216px)}
#restPill b{font-variant-numeric:tabular-nums}

/* ---------- buttons ---------- */

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:50px;padding:0 12px;border-radius:var(--r);
  font-family:var(--ui);font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;
  background:var(--panel2);color:var(--chalk);border:1px solid var(--line2);
  transition:background .14s,border-color .14s,transform .1s;
}
.btn:active{transform:translateY(1px)}
.btn--primary{background:var(--signal);color:var(--signal-ink);border-color:transparent}
.btn--ghost{background:transparent}
.btn--block{display:flex;width:100%}
.btn--sm{height:40px;font-size:10.5px;padding:0 13px;letter-spacing:.1em}
.btn[aria-pressed="true"]{background:var(--chalk);color:var(--ink);border-color:var(--chalk)}
.btn[disabled]{opacity:.45}

/* ---------- library ---------- */
.libbar{position:sticky;top:0;z-index:20;background:var(--ink);padding:calc(var(--safe-t) + 10px) var(--pad) 0;border-bottom:1px solid var(--line)}
.seg{display:flex;gap:18px;padding-bottom:9px}
.seg button{font-family:var(--ui);font-weight:800;font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);padding:9px 0;min-height:44px;border-bottom:2px solid transparent;transition:color .15s,border-color .15s}
.seg button[aria-selected="true"]{color:var(--chalk);border-bottom-color:var(--signal)}
.search{display:flex;align-items:center;gap:9px;background:var(--floor);border:1px solid var(--line2);border-radius:var(--r);padding:0 11px;height:42px;margin-bottom:10px}
.search input{flex:1;min-width:0;border:0;background:none;color:var(--chalk);font-family:var(--ui);font-size:16px;font-weight:500;outline:none}
.search input::placeholder{color:var(--muted)}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;min-height:44px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line2);border-radius:2px;padding:9px 13px;white-space:nowrap;transition:all .14s}
.chip[aria-pressed="true"]{background:var(--chalk);color:var(--ink);border-color:var(--chalk)}

.libgrid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-bottom:1px solid var(--line);overscroll-behavior-x:contain;touch-action:pan-x pan-y}
@media(min-width:620px){.libgrid{grid-template-columns:1fr 1fr 1fr}}
.libcard{background:var(--ink);text-align:left;position:relative;overflow:hidden;transition:background .15s;content-visibility:auto;contain-intrinsic-size:auto 230px}
.libcard:active{background:var(--panel)}
.libcard .ph{position:relative;aspect-ratio:16/10;overflow:hidden;background:var(--panel2)}
.libcard .ph img{width:100%;height:100%;object-fit:cover;filter:saturate(.72) contrast(1.06) brightness(.82);transition:transform .5s var(--ease),filter .3s}
.libcard:hover .ph img{transform:scale(1.04);filter:saturate(.95) contrast(1.05) brightness(.92)}
.libcard .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,color-mix(in srgb,var(--ink) 92%,transparent) 100%)}
.libcard .tx{padding:9px 10px 12px}
.libcard .nm{font-family:var(--disp);font-weight:800;font-size:16px;line-height:.96;text-transform:uppercase;letter-spacing:.01em}
.libcard .mt2{font-size:10px;color:var(--muted);margin-top:4px;letter-spacing:.03em;text-transform:uppercase;font-weight:700}
.libcard .idx{position:absolute;top:7px;left:8px;z-index:2;font-family:var(--disp);font-weight:900;font-size:10px;letter-spacing:.14em;color:var(--chalk);background:color-mix(in srgb,var(--ink) 72%,transparent);padding:2px 5px;backdrop-filter:blur(6px)}
.empty{padding:44px 20px;text-align:center;color:var(--muted);font-size:13px}

/* ---------- progress ---------- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.kpi{background:var(--ink);padding:16px var(--pad)}
.kpi .v{font-family:var(--disp);font-weight:900;font-size:38px;line-height:.9;font-variant-numeric:tabular-nums}
.kpi .v small{font-family:var(--ui);font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin-left:4px;text-transform:uppercase}
.kpi .k{font-size:9.5px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.bars{display:flex;align-items:flex-end;gap:4px;height:88px;margin-top:14px}
.bars .b{flex:1;background:var(--line2);position:relative;transition:height .4s var(--ease)}
.bars .b[data-has="1"]{background:var(--chalk)}
.bars .b[data-now="1"]{background:var(--signal)}
.bars .b span{position:absolute;bottom:-17px;left:0;right:0;text-align:center;font-size:8.5px;color:var(--muted);font-weight:700;letter-spacing:.05em}
.prrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.prrow .nm{font-weight:700;font-size:13.5px}
.prrow .sub{font-size:10.5px;color:var(--muted);margin-top:2px}
.prrow .val{font-family:var(--disp);font-weight:800;font-size:19px;font-variant-numeric:tabular-nums}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .26s var(--ease);z-index:60;cursor:pointer}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:70;
  max-height:92vh;max-height:92dvh;overflow:hidden;
  background:var(--panel);border-top:1px solid var(--line2);
  border-radius:10px 10px 0 0;
  transform:translateY(101%);transition:transform .34s var(--ease);
  display:flex;flex-direction:column;
  will-change:transform;
}
.sheet.on{transform:none}
@media(min-width:760px){
  .sheet{left:50%;right:auto;transform:translate(-50%,101%);width:640px;border-radius:10px;bottom:2vh;max-height:88vh;max-height:88dvh}
  .sheet.on{transform:translate(-50%,0)}
}
.sheet-grab{padding:14px 0 8px;display:flex;justify-content:center;flex:0 0 auto;cursor:grab;touch-action:pan-x}
.sheet-grab i{width:48px;height:5px;border-radius:3px;background:color-mix(in srgb,var(--chalk) 30%,var(--line2));display:block}
.sheet:focus{outline:none}
.sheet:focus-visible{outline:2px solid var(--signal);outline-offset:-2px}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 var(--pad) calc(22px + var(--safe-b));flex:1 1 auto}
.sheet-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-top:4px}
.xbtn{width:44px;height:44px;flex:0 0 auto;display:grid;place-items:center;border:1px solid var(--line2);border-radius:2px;color:var(--muted)}
.xbtn svg{stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}
.thumb-vid{position:relative;aspect-ratio:16/9;background:var(--panel2);overflow:hidden;border-radius:var(--r)}
.thumb-vid img{width:100%;height:100%;object-fit:cover;filter:brightness(.86) saturate(.9)}
.thumb-vid .play{position:absolute;inset:0;display:grid;place-items:center}
.thumb-vid .play span{width:54px;height:54px;display:grid;place-items:center;background:color-mix(in srgb,var(--ink) 55%,transparent);border:1px solid rgba(255,255,255,.45);border-radius:50%;backdrop-filter:blur(4px)}
.thumb-vid svg{fill:#fff;width:20px;height:20px;margin-left:2px}
.thumb-vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.steps{padding-left:17px;margin:8px 0 0}
.steps li{margin-bottom:7px;font-size:13.5px;line-height:1.5}
.cues{display:flex;gap:9px;align-items:flex-start;margin-bottom:8px;font-size:13px;line-height:1.45}
.cues i{color:var(--signal);font-style:normal;font-size:10px;margin-top:3px}
.cues.bad i{color:var(--muted)}

/* ---------- tabbar ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  height:calc(var(--tabh) + var(--safe-b));padding-bottom:var(--safe-b);
  display:flex;
  background:color-mix(in srgb,var(--ink) 90%,transparent);
  backdrop-filter:blur(18px) saturate(1.25);-webkit-backdrop-filter:blur(18px) saturate(1.25);
  border-top:1px solid var(--line);
}
.tabbar a{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--muted);position:relative;transition:color .16s;
}
.tabbar a svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabbar a b{font-size:9px;font-weight:800;letter-spacing:.11em;text-transform:uppercase}
.tabbar a[aria-current="page"]{color:var(--chalk)}
.tabbar a[aria-current="page"]::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:26px;height:2px;background:var(--signal)}

@media(min-width:820px){
  .tabbar{left:50%;right:auto;transform:translateX(-50%);width:760px;max-width:100%;border-left:1px solid var(--line);border-right:1px solid var(--line)}
}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(var(--tabh) + var(--safe-b) + 14px);transform:translate(-50%,10px);
  background:var(--chalk);color:var(--ink);z-index:90;
  font-size:12.5px;font-weight:700;padding:10px 15px;border-radius:2px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s var(--ease);
  max-width:min(88vw,420px);text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
body.hasdock .toast{bottom:calc(var(--tabh) + var(--safe-b) + 216px)}
body.hasdock.dockmini .toast{bottom:calc(var(--tabh) + var(--safe-b) + 150px)}
body.hasdock.dockmini #restPill{bottom:calc(var(--tabh) + var(--safe-b) + 150px)}

/* ---------- misc ---------- */
.listrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 0;border-bottom:1px solid var(--line);width:100%}
.listrow .nm{font-weight:700;font-size:14px}
.listrow .sub{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.chev{color:var(--muted);font-size:20px;flex:0 0 auto;line-height:1}
.toggle{width:46px;height:31px;border-radius:16px;background:var(--line2);position:relative;flex:0 0 auto;transition:background .18s}
.toggle::after{content:"";position:absolute;top:5px;left:3px;width:21px;height:21px;border-radius:50%;background:var(--chalk);transition:transform .2s var(--ease)}
.toggle[aria-checked="true"]{background:var(--signal)}
.toggle[aria-checked="true"]::after{transform:translateX(19px);background:var(--signal-ink)}
.note{border-left:2px solid var(--signal);padding:2px 0 2px 11px;font-size:12.5px;line-height:1.5;color:var(--muted)}
.bignum{font-family:var(--disp);font-weight:900;font-size:64px;line-height:.82;letter-spacing:-.01em}
@media(prefers-reduced-motion:reduce){
  *,::before,::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
.skip-link{position:absolute;left:12px;top:-48px;z-index:200;background:var(--chalk);color:var(--ink);font-weight:800;font-size:13px;padding:10px 14px;border-radius:2px;transition:top .15s}
.skip-link:focus{top:12px}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
@media print{
  .tabbar,.dock,#restPill,.lane canvas,.toast,.scrim,.sheet{display:none!important}
  body{background:#fff;color:#000}
  #view{max-width:none;padding:0}
}
</style>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Detail"><div class="sheet-grab"><i></i></div><div class="sheet-body" id="sheetBody"></div></div>

<div class="dock" id="dock"></div>

<script src="data.js"></script>
<script>
/* =====================================================================
   SURGE v2 — core: state, storage, helpers, the lane engine
   ===================================================================== */
const D  = window.DATA;
const EX = Object.fromEntries(D.exercises.map(e=>[e.id,e]));
const ST = Object.fromEntries((D.stretches||[]).map(e=>[e.id,e]));
const P  = D.program;
const DAY_ORDER = ['A','R1','B','R2','C'];
const DAY_SHORT = {A:'A',B:'B',C:'C',R1:'R1',R2:'R2'};
const WD2DAY = {1:'A',2:'R1',3:'B',4:'R2',5:'C'};
const GROUPS = ['Chest','Back','Shoulders','Biceps','Triceps','Forearms','Quads','Hamstrings','Glutes','Calves','Core','Mobility','Conditioning'];

const KEY='surge.v1', OLD_KEY='forge.v1';
const THEME_KEY='surge.theme', OLD_THEME='forge.theme';
const EQUIP_LIST=[['dumbbell','Dumbbells'],['barbell','Barbells'],['bench','Benches'],['rack','Squat Racks'],['cable','Cable Stations'],['machine','Machines'],['band','Bands'],['kettlebell','Kettlebells']];

/* ---------------- utils ---------------- */
const pad2=n=>String(n).padStart(2,'0');
const dkey=(d=new Date())=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const parseKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const todayKey=()=>dkey();
const dayName=k=>parseKey(k).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
const daysBetween=(a,b)=>Math.round((parseKey(b)-parseKey(a))/86400000);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDur=ms=>{const s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;return h?`${h}:${pad2(m)}:${pad2(ss)}`:`${m}:${pad2(ss)}`};
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const roundTo=(v,step)=>Math.round(v/step)*step;

function toast(msg){
  const t=document.getElementById('toast');
  if(!t) return;
  t.textContent=msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),2000);
}
function buzz(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }

/* ---------------- equipment ---------------- */
function blankEquip(){ const o={}; EQUIP_LIST.forEach(([k])=>o[k]=true); return o; }
function exNeeds(exId){
  const e=EX[exId]||ST[exId]; if(!e) return [];
  const t=(e.equipment||'').toLowerCase(), out=[];
  if(/dumbbell|db\b/.test(t)) out.push('dumbbell');
  if(/barbell|olympic/.test(t)) out.push('barbell');
  if(/bench/.test(t)) out.push('bench');
  if(/rack|cage|squat stand/.test(t)) out.push('rack');
  if(/cable|pulley|lat pull/.test(t)) out.push('cable');
  if(/machine|smith|leg press|pec deck|hack/.test(t)) out.push('machine');
  if(/band|tube/.test(t)) out.push('band');
  if(/kettlebell/.test(t)) out.push('kettlebell');
  return out;
}
const isBlocked=id=>exNeeds(id).some(t=>S.equipment[t]===false);

/* ---------------- state ---------------- */
function blank(){
  return {v:2,profile:{units:'lb',onboarded:false},settings:{rest:90},equipment:blankEquip(),sessions:{},timer:null};
}
let S=null;
/* storage choice: 'device' or 'folder'. Folder handle lives in memory + IndexedDB. */
let store={mode:'device',folderName:'',handle:null};
let storeReady=false;
let dirty=false;
let writing=false;
let writeQueued=false;
let lastHydratedAt=0;

function normalize(o){
  const b=blank();
  if(!o||typeof o!=='object') return b;
  o.profile=Object.assign(b.profile,o.profile||{});
  o.settings=Object.assign(b.settings,o.settings||{});
  o.equipment=Object.assign(b.equipment,o.equipment||{});
  o.sessions=o.sessions&&typeof o.sessions==='object'?o.sessions:{};
  if(!o.v) o.v=2;
  return o;
}
function load(){
  let raw=null;
  let savedAt=0;
  let storeSetting=null;
  try{
    raw=localStorage.getItem(KEY)||localStorage.getItem(OLD_KEY);
    savedAt=+localStorage.getItem(KEY+'.ts')||0;
    storeSetting=localStorage.getItem('surge.store');
    if(storeSetting){ try{ const p=JSON.parse(storeSetting);
      if(p&&p.mode==='folder'){ store.mode='folder'; store.folderName=p.folderName||''; } }catch(e){} }
  }catch(e){}
  try{ S=raw?normalize(JSON.parse(raw)):blank(); }catch(e){ S=blank(); }
  if(S&&storeSetting){
    try{ const p=JSON.parse(storeSetting);
      S.savedAt=(p&&typeof p.savedAt==='number')?p.savedAt:savedAt;
    }catch(e){ S.savedAt=savedAt; }
  }
  try{
    const tv=localStorage.getItem(THEME_KEY)||localStorage.getItem(OLD_THEME);
    if(tv==='light'||tv==='dark') document.documentElement.dataset.theme=tv;
  }catch(e){}
}
function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(S)); localStorage.removeItem(OLD_KEY); }
  catch(e){ toast('Could not save. Storage is full.'); }
  S.savedAt=Date.now();
  dirty=true;
  try{ localStorage.setItem(KEY+'.ts',String(S.savedAt)); }catch(e){}
  if(store.mode==='folder'&&store.handle) writeFolderBackup();
}
function setTheme(tv){
  document.documentElement.dataset.theme=tv;
  try{ localStorage.setItem(THEME_KEY,tv); }catch(e){}
  const m=document.querySelector('meta[name="theme-color"]');
  if(m) m.content=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||m.content;
  Lane.retint();
}

/* ---------------- session model ---------------- */
function dayForDate(k){
  const wd=parseKey(k).getDay();
  return WD2DAY[wd]||null;
}
function getSession(k,create,dayId){
  if(S.sessions[k]) return S.sessions[k];
  if(!create) return null;
  const id=dayId||dayForDate(k);
  if(!id) return null;
  S.sessions[k]={dayId:id,startedAt:null,endedAt:null,pausedMs:0,pausedAt:null,entries:{},warmup:{},cooldown:{},autoSwaps:[]};
  return S.sessions[k];
}
function entryFor(sess,exId){
  if(!sess.entries[exId]) sess.entries[exId]={sets:[]};
  return sess.entries[exId];
}
function blockFor(dayId,exId){ const d=P[dayId]; return d?d.blocks.find(b=>b.ex===exId):null; }
function ensureSets(sess,dayId,exId){
  const e=entryFor(sess,exId), b=blockFor(dayId,exId);
  const n=b?b.sets:3;
  while(e.sets.length<n) e.sets.push({w:'',r:'',done:false});
  return e;
}
function sessionTotals(sess){
  const d=P[sess.dayId]; if(!d) return {total:0,done:0,pct:0};
  let total=d.warmup.length+d.cooldown.length, done=0;
  d.warmup.forEach((_,i)=>{ if(sess.warmup[i]) done++; });
  d.cooldown.forEach((_,i)=>{ if(sess.cooldown[i]) done++; });
  d.blocks.forEach(b=>{
    const e=sess.entries[b.ex];
    const n=e&&e.sets.length?e.sets.length:b.sets;
    total+=n;
    if(e){ if(e.skipped) done+=n; else done+=e.sets.filter(s=>s.done).length; }
  });
  return {total,done,pct:total?Math.round(done/total*100):0};
}
function elapsed(sess){
  if(!sess.startedAt) return 0;
  const end=sess.endedAt||Date.now();
  return end-sess.startedAt-(sess.pausedMs||0)-(sess.pausedAt?end-sess.pausedAt:0);
}
function lastPerformance(exId,beforeKey){
  const keys=Object.keys(S.sessions).filter(k=>k!==beforeKey&&S.sessions[k].entries&&S.sessions[k].entries[exId]).sort().reverse();
  for(const k of keys){
    const e=S.sessions[k].entries[exId];
    const done=e.sets.filter(s=>s.done&&(s.w||s.r));
    if(done.length) return {date:k,sets:done};
  }
  return null;
}
function bestSet(exId){
  let best=0,at=null,w=0,r=0;
  Object.keys(S.sessions).forEach(k=>{
    const e=S.sessions[k].entries&&S.sessions[k].entries[exId]; if(!e) return;
    e.sets.forEach(s=>{
      if(!s.done) return;
      const ww=parseFloat(s.w)||0, rr=parseFloat(s.r)||0;
      const score=ww>0?ww*(1+rr/30):rr;
      if(score>best){ best=score; at=k; w=ww; r=rr; }
    });
  });
  return {score:best,at,w,r};
}
function strengthSessions(){
  return Object.keys(S.sessions).filter(k=>{
    const s=S.sessions[k];
    return P[s.dayId]&&P[s.dayId].kind==='strength'&&s.endedAt;
  }).sort();
}

/* ---------------- suggestion: last → today → next ---------------- */
function isCond(exId){
  const b=currentBlock(S.sessions[todayKey()])||{};
  if(exId) { const bb=blockFor(S.sessions[todayKey()]&&S.sessions[todayKey()].dayId,exId); if(/min|sec/i.test(String((bb||{}).reps||''))) return true; }
  return /min|sec/i.test(String((b||{}).reps||''));
}
function suggest(exId,dayKey){
  const b=blockFor(S.sessions[dayKey]&&S.sessions[dayKey].dayId,exId);
  const range=b?String(b.reps):'8–10';
  const m=range.match(/(\d+)\s*[–\-]\s*(\d+)/);
  const lo=m?+m[1]:8, hi=m?+m[2]:10;
  const last=lastPerformance(exId,dayKey);
  const inc=S.profile.units==='kg'?2.5:5;
  if(!last) return {last:null,today:null,next:null,lo,hi,inc,first:true,cond:/min|sec/i.test(range)};
  const top=last.sets.reduce((a,s)=>{
    const w=parseFloat(s.w)||0,r=parseFloat(s.r)||0;
    if(!a) return {w,r};
    return (w*(1+r/30))>(a.w*(1+a.r/30))?{w,r}:a;
  },null);
  const hitTop=(parseFloat(top.r)||0)>=hi;
  const today=top.w>0?(hitTop?top.w+inc:top.w):null;
  return {last:top,lastKey:last.date,today,next:today!=null?today+inc:null,lo,hi,inc,first:false,cond:/min|sec/i.test(range)};
}

/* =====================================================================
   THE LANE — a fogged track you move down. Nothing here is a gym layout.
   ===================================================================== */
const Lane=(function(){
  let THREE_=null, renderer=null, scene=null, cam=null, root=null;
  let canvas=null, host=null, ro=null, io=null, raf=0, running=false, built=false;
  let gates=[], streaks=[], travel=0, travelT=0, kick=0, sway=0, swayT=0;
  let gateCount=0, activeGate=0, reduced=false, dragging=false, dragX=0, dragStart=0, firstSync=true;
  let surfCanvas=null, surfTex=null, markCanvas=null, markTex=null, paintSig='';
  const SPACING=13;
  let col={};

  function cssv(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||'#000'; }

  function retint(){
    if(!built||!THREE_) return;
    col={bg:cssv('--ink'),floor:cssv('--floor'),line:cssv('--line2'),chalk:cssv('--chalk'),sig:cssv('--signal'),muted:cssv('--muted'),track:cssv('--track')||'#15151B',trackline:cssv('--trackline')||'#3A3A47'};
    if(scene) scene.fog=new THREE_.FogExp2(col.bg,0.05);
    if(renderer) renderer.setClearColor(col.bg,1);
    if(root){
      root.children.forEach(c=>{ if(c.userData.role==='outer') c.material.color.set(col.bg); });
    }
    const sig=[col.bg,col.track,col.trackline].join('|');
    if(sig!==paintSig){ paintSig=sig; paintSurface(); paintMarks(); }
    gates.forEach((g,i)=>{
      const on=i===activeGate;
      const c=g.userData;
      c.posts.forEach(p=>p.material.color.set(on?col.sig:col.line));
      c.beam.material.color.set(on?col.sig:col.line);
      c.stripe.material.color.set(on?col.sig:col.floor);
      c.stripe.material.opacity=on?0.55:0;
      if(c.veil) c.veil.material.color.set(on?col.sig:col.chalk);
      if(c.veil) c.veil.material.opacity=on?0.05:0.012;
    });
    draw();
  }

  /* the surface: a strip of floor that melts into the fog. no asset, no gym. */
  function paintSurface(){
    if(!surfCanvas) surfCanvas=document.createElement('canvas');
    const W=32,H=512;
    surfCanvas.width=W; surfCanvas.height=H;
    const g=surfCanvas.getContext('2d');
    // canvas top row lands at the far end of the plane, so the distance fades out
    const grd=g.createLinearGradient(0,0,0,H);
    grd.addColorStop(0,col.bg);
    grd.addColorStop(0.3,col.track);
    grd.addColorStop(1,col.track);
    g.fillStyle=grd; g.fillRect(0,0,W,H);
    // edges fall away, so the floor reads as a strip underfoot, not a rectangle
    const side=g.createLinearGradient(0,0,W,0);
    side.addColorStop(0,'rgba(0,0,0,.62)');
    side.addColorStop(.42,'rgba(0,0,0,0)');
    side.addColorStop(.58,'rgba(0,0,0,0)');
    side.addColorStop(1,'rgba(0,0,0,.62)');
    g.fillStyle=side; g.fillRect(0,0,W,H);
    if(surfTex){ surfTex.needsUpdate=true; }
    else if(THREE_){
      surfTex=new THREE_.CanvasTexture(surfCanvas);
      surfTex.wrapS=surfTex.wrapT=THREE_.ClampToEdgeWrapping;
    }
  }

  /* the paint on the floor: side lines, centre dashes, panel seams. scrolls. */
  function paintMarks(){
    if(!markCanvas) markCanvas=document.createElement('canvas');
    const W=256,H=512;
    markCanvas.width=W; markCanvas.height=H;
    const g=markCanvas.getContext('2d');
    g.clearRect(0,0,W,H);
    const px=x=>((x/12)+0.5)*W;
    g.fillStyle=col.trackline;
    g.fillRect(px(-2.45)-1.4,0,2.8,H);
    g.fillRect(px(2.45)-1.4,0,2.8,H);
    g.globalAlpha=.9;
    for(let y=6;y<H;y+=76){ g.fillRect(px(0)-1.7,y,3.4,46); }
    g.globalAlpha=.07;
    for(let y=0;y<H;y+=128){ g.fillRect(px(-2.45),y,px(2.45)-px(-2.45),1.5); }
    g.globalAlpha=1;
    if(markTex){ markTex.needsUpdate=true; }
    else if(THREE_){
      markTex=new THREE_.CanvasTexture(markCanvas);
      markTex.wrapS=markTex.wrapT=THREE_.RepeatWrapping;
      markTex.repeat.set(1,26);
      markTex.anisotropy=Math.min(8,renderer?renderer.capabilities.getMaxAnisotropy():4);
    }
  }

  function build(){
    built=true;
    scene=new THREE_.Scene();
    col={bg:cssv('--ink'),floor:cssv('--floor'),line:cssv('--line2'),chalk:cssv('--chalk'),sig:cssv('--signal'),muted:cssv('--muted'),track:cssv('--track')||'#15151B',trackline:cssv('--trackline')||'#3A3A47'};
    scene.fog=new THREE_.FogExp2(col.bg,0.05);
    cam=new THREE_.PerspectiveCamera(50,1,0.1,220);
    cam.position.set(0,1.52,7.8);
    cam.lookAt(0,-2.98,-9);  // tipped down: the floor fills the frame, not the void
    root=new THREE_.Group(); scene.add(root);

    const outer=new THREE_.Mesh(new THREE_.PlaneGeometry(160,300),new THREE_.MeshBasicMaterial({color:col.bg}));
    outer.rotation.x=-Math.PI/2; outer.position.set(0,-0.03,-90); outer.userData.role='outer'; root.add(outer);

    paintSurface(); paintMarks();
    const surface=new THREE_.Mesh(new THREE_.PlaneGeometry(12,260),new THREE_.MeshBasicMaterial({map:surfTex}));
    surface.rotation.x=-Math.PI/2; surface.position.set(0,0,-80); surface.userData.role='surface'; root.add(surface);
    const ground=new THREE_.Mesh(new THREE_.PlaneGeometry(12,260),new THREE_.MeshBasicMaterial({map:markTex,transparent:true,depthWrite:false}));
    ground.rotation.x=-Math.PI/2; ground.position.set(0,0.004,-80); ground.renderOrder=1; ground.userData.role='marks'; root.add(ground);

    const postGeo=new THREE_.BoxGeometry(0.085,2.9,0.085);
    const beamGeo=new THREE_.BoxGeometry(4.9,0.07,0.07);
    const stripeGeo=new THREE_.BoxGeometry(4.6,0.01,0.62);
    for(let i=0;i<10;i++){
      const g=new THREE_.Group();
      const posts=[-2.45,2.45].map(x=>{
        const p=new THREE_.Mesh(postGeo,new THREE_.MeshBasicMaterial({color:col.line}));
        p.position.set(x,1.45,0); g.add(p); return p;
      });
      const beam=new THREE_.Mesh(beamGeo,new THREE_.MeshBasicMaterial({color:col.line}));
      beam.position.set(0,2.92,0); g.add(beam);
      const stripe=new THREE_.Mesh(stripeGeo,new THREE_.MeshBasicMaterial({color:col.sig,transparent:true,opacity:0}));
      stripe.position.set(0,0.02,0.1); g.add(stripe);
      const veil=new THREE_.Mesh(new THREE_.PlaneGeometry(4.78,2.84),
        new THREE_.MeshBasicMaterial({color:col.chalk,transparent:true,opacity:0.012,depthWrite:false,side:THREE_.DoubleSide}));
      veil.position.set(0,1.44,0); g.add(veil);
      g.position.z=-4; g.userData={posts,beam,stripe,veil}; g.visible=false;
      root.add(g); gates.push(g);
    }

    const sGeo=new THREE_.BoxGeometry(0.022,0.022,2.6);
    for(let i=0;i<14;i++){
      const m=new THREE_.Mesh(sGeo,new THREE_.MeshBasicMaterial({color:col.chalk,transparent:true,opacity:0}));
      m.position.set(0,0.4,0); m.visible=false; root.add(m);
      streaks.push({m,life:0,sp:0});
    }

    retint();
  }

  function size(){
    if(!renderer||!host) return;
    const w=host.clientWidth||360, h=host.clientHeight||280;
    renderer.setSize(w,h,false);
    cam.aspect=w/h; cam.updateProjectionMatrix();
    draw();
  }

  function placeGates(){
    gates.forEach((g,i)=>{
      const z=-4-i*SPACING+travel*SPACING;
      g.position.z=z;
      g.visible=i<gateCount && z<9;
    });
  }

  function draw(){
    if(!renderer||!scene||!cam) return;
    renderer.render(scene,cam);
  }

  let lastT=0;
  function tick(){
    raf=0;
    if(!running) return;
    const now=performance.now();
    const dt=Math.min(0.05,lastT?(now-lastT)/1000:0.0166);
    lastT=now;

    sway+=(swayT-sway)*(1-Math.exp(-4.5*dt));
    cam.position.x=sway;
    cam.rotation.y=-sway*0.045;

    // the whole track slides toward you; the gates go with it, so advancing a
    // station is a real rush forward rather than a change of camera aim.
    travel+=(travelT-travel)*(1-Math.exp(-6.5*dt));
    if(Math.abs(travelT-travel)<0.0015) travel=travelT;
    kick*=Math.exp(-3.4*dt);
    const fov=50+kick*16;
    if(Math.abs(cam.fov-fov)>0.02){ cam.fov=fov; cam.updateProjectionMatrix(); }
    if(markTex) markTex.offset.y=-travel*(SPACING/10);

    placeGates();
    gates.forEach((g,i)=>{
      if(!g.visible||i!==activeGate) return;
      const p=0.5+0.5*Math.sin(now*0.0026);
      g.userData.stripe.material.opacity=0.28+0.3*p;
    });
    for(const s of streaks){
      if(s.life<=0) continue;
      s.life-=dt*1.9;
      s.m.position.z+=s.sp*dt*60;
      s.m.material.opacity=Math.max(0,s.life);
      if(s.life<=0) s.m.visible=false;
    }
    draw();
    raf=requestAnimationFrame(tick);
  }

  function start(){
    if(reduced||!renderer||document.hidden) return;
    if(!running){ running=true; lastT=0; if(!raf) raf=requestAnimationFrame(tick); }
  }
  function stop(){ running=false; if(raf){cancelAnimationFrame(raf);raf=0;} }

  function surge(n){
    if(!renderer) return;
    buzz(12);
    let left=n||99;
    for(const s of streaks){
      if(left<=0) break;
      if(s.life>0) continue;
      left--;
      s.m.visible=true; s.m.position.set((Math.random()-.5)*4.2,0.35+Math.random()*1.4,-26-Math.random()*14);
      s.sp=1.5+Math.random()*1.8; s.life=1; s.m.material.opacity=1;
    }
    if(reduced){ draw(); }
  }

  function sync(meta){
    if(!built) return;
    const nextActive=meta.active||0, nextCount=meta.count||0;
    const advancing=!firstSync && nextActive!==activeGate;
    gateCount=nextCount;
    travelT=nextActive;
    if(firstSync){ travel=nextActive; firstSync=false; }
    else if(advancing && !reduced){ kick=1; surge(5); }
    activeGate=nextActive;
    if(reduced) travel=travelT;
    placeGates();
    gates.forEach((g,i)=>{
      g.userData.stripe.material.opacity=i===activeGate?0.45:0;
    });
    retint();
  }

  function mount(canvasEl,hostEl,meta){
    canvas=canvasEl; host=hostEl;
    reduced=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(!THREE_){ loadThree(); return; }
    if(!renderer){
      try{
        renderer=new THREE_.WebGLRenderer({canvas:canvas,antialias:window.devicePixelRatio<2,alpha:false,powerPreference:'high-performance'});
        renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
      }catch(e){ canvas.style.display='none'; if(hostEl.firstChild) hostEl.classList.add('no3d'); return; }
    }
    if(!built) build();
    size();
    sync(meta||{count:0,active:0});
    start();
    if(ro) ro.disconnect();
    if(window.ResizeObserver){ ro=new ResizeObserver(size); ro.observe(hostEl); }
    watch(hostEl);
    draw();
  }

  function unmount(){ stop(); if(ro){ro.disconnect();ro=null;} if(io){io.disconnect();io=null;} }
  function watch(el){
    if(io) io.disconnect();
    if(!('IntersectionObserver' in window)||!el) return;
    io=new IntersectionObserver(es=>{
      const vis=es.some(e=>e.isIntersecting);
      if(vis) start(); else stop();
    },{threshold:0.02});
    io.observe(el);
  }

  function loadThree(){
    if(window.THREE){ THREE_=window.THREE; onThree(); return; }
    if(Lane._p) { Lane._p.then(onThree); return; }
    Lane._p=new Promise(res=>{
      const s=document.createElement('script');
      s.src='assets-v2/three.min.js';
      s.onload=()=>res(true); s.onerror=()=>res(false);
      document.head.appendChild(s);
    });
    Lane._p.then(ok=>{ if(ok&&window.THREE){ THREE_=window.THREE; onThree(); } });
  }
  function onThree(){
    const c=document.getElementById('laneCanvas'), h=document.getElementById('lane');
    if(c&&h) mount(c,h,Lane._last||{count:0,active:0});
  }

  return {
    mount,unmount,sync,surge,retint,
    setMeta(m){ Lane._last=m; },
    isLive:()=>!!renderer,
    dbg:()=>({cam:cam?{p:cam.position.toArray(),rot:[cam.rotation.x,cam.rotation.y,cam.rotation.z],fov:cam.fov,aspect:cam.aspect}:null,travel,travelT,kick,sway,gates:gates.map(g=>({z:+g.position.z.toFixed(2),v:g.visible}))}),
    nudge(d){ swayT=clamp(swayT+d,-0.9,0.9); },
    release(){ swayT=0; }
  };
})();
</script>
<script>
/* =====================================================================
   SURGE v2 — screens, logging, actions
   ===================================================================== */
const $=id=>document.getElementById(id);
let LIB={tab:'lift',q:'',muscle:''};
let REST_TICK=null;

/* ---------------- week ---------------- */
function weekDays(){
  const now=new Date(), mon=new Date(now);
  mon.setDate(now.getDate()-((now.getDay()+6)%7));
  return DAY_ORDER.map((id,i)=>{
    const d=new Date(mon); d.setDate(mon.getDate()+i);
    const k=dkey(d), s=S.sessions[k];
    return {id,k,date:d,done:!!(s&&s.endedAt),now:k===todayKey(),kind:P[id].kind};
  });
}
function weekRailHTML(){
  return `<div class="weekrail" role="tablist" aria-label="This week">${weekDays().map(w=>`
    <button class="wtick" data-kind="${w.kind}" data-state="${w.done?'done':w.now?'now':'todo'}"
      data-act="jump-day" data-day="${w.id}" data-key="${w.k}" aria-label="${esc(P[w.id].title)}">`+
      `<b></b><span>${w.id==='R1'?'R1':w.id==='R2'?'R2':w.id}</span></button>`).join('')}</div>`;
}

/* ---------------- current position ---------------- */
function doneCount(sess,exId){
  const e=sess.entries[exId]; if(!e) return 0;
  if(e.skipped) return 99;
  return e.sets.filter(s=>s.done).length;
}
function currentIdx(sess){
  const d=P[sess.dayId]; if(!d) return -1;
  for(let i=0;i<d.blocks.length;i++){
    const b=d.blocks[i];
    const e=sess.entries[b.ex];
    const n=e&&e.sets.length?e.sets.length:b.sets;
    const dn=e?e.sets.filter(s=>s.done).length:0;
    if(e&&e.skipped) continue;
    if(dn<n) return i;
  }
  return -1;
}
function allDone(sess){
  const d=P[sess.dayId]; if(!d) return false;
  return d.blocks.every(b=>{
    const e=sess.entries[b.ex];
    if(e&&e.skipped) return true;
    const n=e&&e.sets.length?e.sets.length:b.sets;
    return e&&e.sets.filter(s=>s.done).length>=n;
  });
}

/* ---------------- lane block ---------------- */
function laneHTML(sess){
  const d=sess?P[sess.dayId]:null;
  const blocks=d?d.blocks:[];

  // The lane only spans the movements you can actually get to — a skipped
  // station stays in the plan but leaves the track, so progress never stalls.
  const live=[];
  if(d) d.blocks.forEach((b,i)=>{ if(!(sess.entries[b.ex]&&sess.entries[b.ex].skipped)) live.push({b,i}); });

  const idx=sess?currentIdx(sess):-1;
  const livePos=idx<0?live.length-1:live.findIndex(x=>x.i===idx);
  const active=Math.max(0,Math.min(live.length-1,livePos));

  Lane.setMeta({count:live.length,active});

  return `<div class="weekbar">${weekRailHTML()}</div>
  <section class="lane" id="lane" aria-label="Your position in this session" data-drag="1">
    <canvas id="laneCanvas" role="img" aria-label="Session progress visualization"></canvas>
    <div class="lane-fallback" aria-hidden="true"></div>
    <div class="lane-hud">
      <div class="lane-foot">
        <div class="station-no">${d?esc(d.title):'Rest day'}<em> ${live.length?pad2(active+1):'—'}</em>/${pad2(live.length)}</div>
        <div class="lane-clock" id="laneClock" data-live="${sess&&sess.startedAt&&!sess.endedAt&&!sess.pausedAt?1:0}">${sess&&sess.startedAt?fmtDur(elapsed(sess)):''}</div>
      </div>
    </div>
  </section>`;
}

/* the clock in the lane ticks without re-rendering the page */
setInterval(()=>{
  const el=document.getElementById('laneClock');
  if(!el) return;
  const sess=S&&S.sessions[todayKey()];
  if(!sess||!sess.startedAt) return;
  el.textContent=fmtDur(elapsed(sess));
},1000);

/* ---------------- tempo strip ---------------- */
function tempoHTML(exId,key){
  const sg=suggest(exId,key), u=S.profile.units;
  if(sg.cond){
    const b=blockFor(S.sessions[key]&&S.sessions[key].dayId,exId);
    const target=b?String(b.reps):'';
    const lastT=sg.last&&sg.last.r!=null?sg.last:null;
    return `<div class="tempo">
      <div><div class="k">Last</div><div class="v">${lastT?esc(String(lastT.r)):'<span style="color:var(--muted)">—</span>'}</div><div class="d">${lastT?esc((sg.lastKey||'').slice(5).replace('-','/')):'no history yet'}</div></div>
      <div class="now"><div class="k">Today</div><div class="v">${esc(target)}</div><div class="d">steady pace</div></div>
      <div><div class="k">Done</div><div class="v">✓</div><div class="d">log it below</div></div>
    </div>`;
  }
  if(sg.first){
    return `<div class="tempo">
      <div><div class="k">First time</div><div class="v" style="color:var(--muted)">—</div><div class="d">no history yet</div></div>
      <div class="now"><div class="k">Today</div><div class="v">${sg.lo}–${sg.hi}</div><div class="d">pick a light weight</div></div>
      <div><div class="k">Next</div><div class="v" style="color:var(--muted)">—</div><div class="d">after today</div></div>
    </div>`;
  }
  const f=v=>v==null?'—':`${v}`;
  const sd=k=>k?parseKey(k).toLocaleDateString(undefined,{weekday:'short',day:'numeric'}):'';
  return `<div class="tempo">
    <div><div class="k">Last</div><div class="v">${f(sg.last?sg.last.w:null)}<span class="u">${u}×${sg.last?sg.last.r:''}</span></div><div class="d">${esc(sd(sg.lastKey))}</div></div>
    <div class="now"><div class="k">Today</div><div class="v">${f(sg.today)}<span class="u">${sg.today!=null?u:'BW'}</span></div><div class="d">aim ${sg.lo}–${sg.hi} reps</div></div>
    <div><div class="k">Next</div><div class="v">${f(sg.next)}<span class="u">${sg.next!=null?u:''}</span></div><div class="d">when today lands</div></div>
  </div>`;
}

/* ---------------- today ---------------- */
function viewToday(){
  const k=todayKey(), sess=S.sessions[k];
  if(!S.profile.onboarded) return introHTML();
  if(!sess||!sess.startedAt) return readyHTML(k);
  if(sess.endedAt) return doneHTML(k,sess);
  return activeHTML(k,sess);
}

function introHTML(){
  return `<div class="fade">
    <div class="weekstrip" aria-label="This week's plan">
      <div class="kicker">This week · five days</div>
      <div class="weekstrip-row">
        ${DAY_ORDER.map((id,ix)=>{const dd=P[id];const isT=ix===(new Date().getDay()+6)%7;return `<div class="wcell" data-kind="${dd.kind}"${isT?' data-today="1"':''}><b>${id}</b><span>${isT?'Today':(dd.kind==='strength'?'Lift':'Easy')}</span><i></i></div>`}).join('')}
      </div>
    </div>
    <div class="sect">
      <div class="kicker">Training log</div>
      <h1 class="disp" style="font-size:clamp(40px,11.5vw,64px);margin-top:10px;overflow-wrap:break-word">Today’s session is ready.</h1>
      <p class="small muted" style="margin-top:16px;max-width:38ch">Monday to Friday, open the app and lift. Every movement has a video. Your last numbers sit next to the bar.</p>
    </div>
    <div class="panel sect">
      <div class="head"><h2>Units</h2></div>
      <div class="units2" role="group" aria-label="Units">
        <button class="btn" data-act="units" data-u="lb" aria-pressed="${S.profile.units==='lb'}">LB</button>
        <button class="btn" data-act="units" data-u="kg" aria-pressed="${S.profile.units==='kg'}">KG</button>
      </div>
      <p class="tiny muted" style="margin-top:12px">Nothing to sign up for. This screen shows once.</p>
      <button class="btn btn--primary btn--block sticky-cta" style="margin-top:18px;height:56px" data-act="begin">Open today’s session</button>
    </div>
    <div class="panel sect">
      <div class="head"><h2>The week</h2></div>
      ${DAY_ORDER.map(id=>{const d=P[id];return `<div class="listrow" style="cursor:default">
        <div><div class="nm">${esc(d.title)}</div><div class="sub">${esc(d.subtitle)} · ${esc(d.duration)}</div></div>
        <span class="tag ${d.kind==='strength'?'tag--sig':''}">${d.kind==='strength'?'Lift':'Easy'}</span>
      </div>`}).join('')}
    </div>
  </div>`;
}

function readyHTML(k){
  const dayId=dayForDate(k)||'A';
  const d=P[dayId];
  const weekend=!dayForDate(k);
  return `<div class="fade">
    ${laneHTML(null)}
    <div class="station">
      <div class="station-ghost">${weekend?'REST':pad2(DAY_ORDER.indexOf(dayId)+1)}</div>
      <div class="kicker">${weekend?'Rest day':'Today'} · ${esc(d.duration)}</div>
      <h1>${esc(d.title)}</h1>
      <div class="small muted" style="max-width:44ch">${esc(weekend?'Nothing on the schedule today. Rest counts, but any session can start anyway.':d.purpose)}</div>
      <div class="station-meta" style="margin-top:12px">${d.blocks.length} movements <span class="tag">${d.kind==='strength'?'Strength':'Recovery'}</span></div>
      <button class="btn btn--primary btn--block" style="margin-top:18px;height:56px" data-act="start" data-day="${dayId}">
        ${weekend?'Start anyway':'Start '+esc(d.title)}
      </button>
    </div>
    <div class="panel sect">
      <div class="head"><h2>What's inside</h2><span class="tiny muted">${d.blocks.length} stations</span></div>
      ${d.blocks.map((b,i)=>{const e=EX[b.ex]||ST[b.ex];return `
        <button class="listrow" data-act="open-ex" data-ex="${b.ex}">
          <div style="min-width:0">
            <div class="nm">${pad2(i+1)} · ${esc(e?e.name:b.ex)}</div>
            <div class="sub">${b.sets} × ${esc(b.reps)}${b.note?' · '+esc(b.note):''}</div>
          </div>
          <span class="chev">›</span>
        </button>`}).join('')}
    </div>
    <div class="panel sect">
      <div class="head"><h2>Warm-up</h2><span class="tiny muted">5 min</span></div>
      ${d.warmup.map(w=>`<div class="listrow" style="cursor:default"><div><div class="nm">${esc(w.name)}</div><div class="sub">${esc(w.detail)}</div></div></div>`).join('')}
    </div>
  </div>`;
}

function activeHTML(k,sess){
  const d=P[sess.dayId];
  const idx=currentIdx(sess);
  const finished=idx<0;
  const b=finished?null:d.blocks[idx];
  const e=b?(EX[b.ex]||ST[b.ex]):null;
  const tot=sessionTotals(sess);

  if(finished){
    return `<div class="fade">
      ${laneHTML(sess)}
      <div class="station">
        <div class="station-ghost">OK</div>
        <div class="kicker">Finished</div>
        <h1>Every set logged.</h1>
        <p class="small muted" style="margin-top:8px">${tot.done} sets in ${fmtDur(elapsed(sess))}. Saved.</p>
        <div class="grid2" style="margin-top:18px">
          <button class="btn btn--primary" data-act="finish" data-key="${k}">Finish</button>
          <button class="btn btn--ghost" data-act="summary" data-key="${k}">Review</button>
        </div>
      </div>
    </div>`;
  }

  return `<div class="fade">
    ${laneHTML(sess)}
    <div class="station station--live">
      <div class="station-ghost">${pad2(idx+1)}</div>
      <div class="kicker">Station ${pad2(idx+1)} of ${pad2(d.blocks.length)} · set ${Math.min(doneCount(sess,b.ex)+1,b.sets)} of ${b.sets}</div>
      <h1>${esc(e.name)}</h1>
      <div class="station-meta">
        <span class="tag tag--sig">${b.sets} × ${esc(b.reps)}</span>
        ${e.equipment&&e.equipment!=='None'?`<span class="tag">${esc(e.equipment)}</span>`:''}
        <button class="tag" data-act="open-ex" data-ex="${b.ex}" style="cursor:pointer">Watch how ›</button>
      </div>
      ${b.note?`<p class="tiny muted" style="margin-top:9px">${esc(b.note)}</p>`:''}
    </div>
    ${tempoHTML(b.ex,k)}

function logHTML(k,sess,b){
  const ent=ensureSets(sess,sess.dayId,b.ex);
  const done=ent.sets.map((s,i)=>({s,i})).filter(x=>x.s.done);
  if(!done.length) return `<div class="logger"><div class="tiny muted" style="padding-bottom:6px">No sets on this one yet.</div></div>`;
  const u=S.profile.units;
  const rows=done.map(({s,i})=>`<div class="setdone">
      <span class="i"><svg viewBox="0 0 24 24" width="11" height="11" aria-hidden="true" style="stroke:var(--signal);stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round"><path d="M4 12.5l5.2 5.2L20 6.5"/></svg></span>
      <span class="v">${esc(s.w||'BW')}${s.w?` <span style="font-size:11px;color:var(--muted)">${u}</span>`:''} × ${esc(s.r)}</span>
      <span class="t">set ${pad2(i+1)}</span>
      <button class="undo" data-act="undo-set" data-ex="${b.ex}" data-i="${i}">undo</button>
    </div>`).join('');
  return `<div class="logger">
    <div class="head" style="margin-bottom:2px"><h2>Logged</h2><span class="tiny muted">${done.length} of ${b.sets}</span></div>
    ${rows}
    <div class="tiny muted" style="margin-top:10px">Leave two reps in the tank. Add load only when every rep looks the same.</div>
  </div>`;
}

function draftFor(sess,exId){
  sess._draft=sess._draft||{};
  if(sess._draft[exId]) return sess._draft[exId];
  const e=entryFor(sess,exId);
  const lastDone=[...e.sets].reverse().find(s=>s.done);
  if(lastDone) return (sess._draft[exId]={w:lastDone.w||'',r:lastDone.r||''});
  const sg=suggest(exId,todayKey());
  return (sess._draft[exId]={w:sg.today!=null?String(sg.today):'',r:String(sg.lo)});
}

/* ---------------- progress ---------------- */
function viewProgress(){
  const keys=Object.keys(S.sessions).filter(k=>S.sessions[k].endedAt).sort();
  let sets=0,mins=0;
  keys.forEach(k=>{
    const s=S.sessions[k], d=P[s.dayId]; if(!d) return;
    mins+=Math.round(elapsed(s)/60000);
    d.blocks.forEach(b=>{const e=s.entries[b.ex]; if(e&&!e.skipped) sets+=e.sets.filter(x=>x.done).length});
  });
  const strength=keys.filter(k=>P[S.sessions[k].dayId]&&P[S.sessions[k].dayId].kind==='strength');

  // last 8 weeks of set counts
  const weeks=[];
  for(let i=7;i>=0;i--){
    const end=new Date(); end.setDate(end.getDate()-i*7);
    const start=new Date(end); start.setDate(end.getDate()-6);
    let n=0;
    keys.forEach(k=>{
      const t=parseKey(k);
      if(t>=start&&t<=end){
        const s=S.sessions[k];
        Object.values(s.entries).forEach(e=>{ if(!e.skipped) n+=e.sets.filter(x=>x.done).length; });
      }
    });
    weeks.push({n,label:i===0?'now':'-'+i});
  }
  const peak=Math.max(1,...weeks.map(w=>w.n));

  // best sets
  const prs=D.exercises.map(e=>({e,b:bestSet(e.id)})).filter(x=>x.b.score>0)
    .sort((a,b)=>b.b.score-a.b.score).slice(0,8);

  return `<div class="fade">
    <div class="topbar" style="position:static;background:none;backdrop-filter:none;border:0;padding-top:calc(var(--safe-t) + 18px)">
      <div class="wordmark">SURGE<i>.</i></div><div class="tiny muted">${keys.length?keys.length+' sessions':'no sessions yet'}</div>
    </div>
    <div class="sect" style="padding-bottom:10px">
      <div class="kicker">The record</div>
      <h1 class="disp" style="font-size:clamp(38px,11vw,58px);margin-top:6px">${keys.length?esc(String(keys.length))+' sessions.<br>'+esc(String(sets))+' sets.':'Your numbers will live here.'}</h1>
      <p class="small muted" style="margin-top:10px">${keys.length?'Only what you logged.':'Finish one session and this page fills in.'}</p>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="v">${strength.length}<small>lifts</small></div><div class="k">Strength sessions</div></div>
      <div class="kpi"><div class="v">${sets}<small>sets</small></div><div class="k">Sets completed</div></div>
      <div class="kpi"><div class="v">${mins}<small>min</small></div><div class="k">Time trained</div></div>
      <div class="kpi"><div class="v">${prs.length}<small>lifts</small></div><div class="k">Tracked bests</div></div>
    </div>
    <div class="panel sect">
      <div class="head"><h2>Sets per week</h2><span class="tiny muted">last 8</span></div>
      <div class="bars">
        ${weeks.map((w,i)=>`<div class="b" data-has="${w.n>0?1:0}" data-now="${i===7?1:0}" style="height:${Math.max(3,Math.round(w.n/peak*100))}%"><span>${esc(w.label)}</span></div>`).join('')}
      </div>
      <div style="height:20px"></div>
    </div>
    <div class="panel sect">
      <div class="head"><h2>Best set</h2><span class="tiny muted">per movement</span></div>
      ${prs.length?prs.map(({e,b})=>`<div class="prrow">
        <div><div class="nm">${esc(e.name)}</div><div class="sub">${b.at?esc(dayName(b.at)):''}</div></div>
        <div class="val">${b.w?esc(String(b.w))+'<span style="font-size:10px;color:var(--muted)">'+S.profile.units+'</span> × ':''}${esc(String(b.r))}</div>
      </div>`).join(''):`<div class="empty">No sets logged yet.</div>`}
    </div>
    <div class="panel sect">
      <div class="head"><h2>History</h2></div>
      ${keys.length?keys.slice().reverse().slice(0,20).map(k=>{
        const s=S.sessions[k], d=P[s.dayId];
        return `<button class="listrow" data-act="summary" data-key="${k}">
          <div><div class="nm">${esc(d?d.title:'Session')}</div><div class="sub">${esc(dayName(k))} · ${s.endedAt?fmtDur(elapsed(s)):'incomplete'}</div></div>
          <span class="chev">›</span></button>`}).join(''):`<div class="empty">No history yet.</div>`}
    </div>
  </div>`;
}

let sheetPrevFocus=null;
function openSheet(html){
  sheetPrevFocus=document.activeElement;

  if(_t&&_t.textContent) $('sheet').setAttribute('aria-label',_t.textContent.trim().slice(0,80));
  $('sheet').classList.add('on');
  $('scrim').classList.add('on');
  document.body.style.overflow='hidden';
  $('sheetBody').scrollTop=0;
  const f=$('sheetBody').querySelector('.xbtn');
  if(f&&f.focus) f.focus({preventScroll:true});
}
function closeSheet(){
  if(!$('sheet')||!$('sheet').classList.contains('on')) return;
  $('sheet').classList.remove('on');
  $('scrim').classList.remove('on');
  document.body.style.overflow='';
  if(sheetPrevFocus&&document.contains(sheetPrevFocus)){ try{sheetPrevFocus.focus({preventScroll:true});}catch(e){} }
  sheetPrevFocus=null;
}

  if(ev.key==='Escape'&&$('sheet').classList.contains('on')) closeSheet();
});

/* ---------------- dock: steppers + log, always under the thumb ---------------- */
function currentBlock(sess){
  if(!sess||sess.endedAt||!sess.startedAt) return null;
  const i=currentIdx(sess);
  if(i<0) return null;
  const d=P[sess.dayId];
  return d?d.blocks[i]:null;
}
function syncDock(){
  const dock=$('dock');
  if(!dock) return;
  const sess=S.sessions[todayKey()];
  const b=route()==='today'?currentBlock(sess):null;
  if(!b){
    if(dock.innerHTML) dock.innerHTML='';
    dock.classList.remove('on'); document.body.classList.remove('hasdock');
    return;
  }
  const ent=ensureSets(sess,sess.dayId,b.ex);
  const doneN=ent.sets.filter(s=>s.done).length;
  const d=draftFor(sess,b.ex), u=S.profile.units;
  const cond=/min|sec/i.test(String((b||{}).reps||''));

  // Rebuild when the station changes OR the mode flips; otherwise just repaint values, so
  // focus and caret survive a re-render while someone is typing a number.
  const same=dock.dataset.ex===b.ex&&dock.dataset.cond===String(cond);
  if(!same){
    dock.dataset.ex=b.ex; dock.dataset.cond=String(cond);
    const exn2=(EX[b.ex]||ST[b.ex]||{name:b.ex}).name;
    dock.innerHTML=cond?`
      <div class="dock-hd">
        <div class="dock-title">
          <div class="dock-k"><em>Log:</em> ${esc(exn2)}</div>
          <div class="dock-sub" data-role="subset"></div>
        </div>
        <button class="dock-fold" data-act="dock-fold" aria-expanded="true" aria-label="Collapse logger"><svg viewBox="0 0 24 24"><path d="M6 14l6-6 6 6"/></svg></button>
      </div>
      <div class="steppers">
        <div class="stepper">
          <div class="lab">Done</div>
          <div class="ctl">
            <button class="stepbtn" data-act="step" data-f="r" data-d="-1" aria-label="Less time">−</button>
            <input id="inR" type="text" inputmode="numeric" value="" data-act="type" data-f="r" aria-label="Minutes or seconds done">
            <button class="stepbtn" data-act="step" data-f="r" data-d="1" aria-label="More time">+</button>
          </div>
        </div>
        <div class="stepper">
          <div class="lab">Note</div>
          <div class="ctl">
            <input id="inW" type="text" inputmode="text" value="" data-act="type" data-f="w" aria-label="Optional note, for example distance" placeholder="—">
          </div>
        </div>
      </div>
      <button class="logbtn" data-act="log-set" data-ex="${b.ex}">Log set</button>`:`
      <div class="dock-hd">
        <div class="dock-title">
          <div class="dock-k"><em>Log:</em> ${esc(exn2)}</div>
          <div class="dock-sub" data-role="subset"></div>
        </div>
        <button class="dock-fold" data-act="dock-fold" aria-expanded="true" aria-label="Collapse logger"><svg viewBox="0 0 24 24"><path d="M6 14l6-6 6 6"/></svg></button>
      </div>
      <div class="steppers">
        <div class="stepper">
          <div class="lab">Weight <span style="opacity:.6">${esc(u)}</span></div>

          </div>

            <button class="stepbtn" data-act="step" data-f="r" data-d="-1" aria-label="Fewer reps">−</button>

/* ---------------- render ---------------- */
const ROUTES=['today','library','progress','you'];
function route(){
  const h=(location.hash||'#/today').replace(/^#\//,'').split('?')[0];
  return ROUTES.includes(h)?h:'today';
}
function render(){
  const r=route();
  const html = r==='library'?viewLibrary() : r==='progress'?viewProgress() : r==='you'?viewYou() : viewToday();
  $('view').innerHTML=html;
  document.querySelectorAll('.tabbar a').forEach(a=>{
    if(a.dataset.tab===r) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');
  });
  const canvas=$('laneCanvas');
  if(canvas){ Lane.mount(canvas,$('lane'),Lane._last||{count:0,active:0}); }
  else Lane.unmount();
  const q=$('libQ');
  if(q&&LIB.q){ q.focus(); q.setSelectionRange(q.value.length,q.value.length); }

}

/* ---------------- actions ---------------- */
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act;
  const k=todayKey();
  const sess=S.sessions[k];

  switch(act){
    case 'close-sheet': closeSheet(); break;
    case 'begin': S.profile.onboarded=true; save(); render(); buzz(18); break;
    case 'units': S.profile.units=el.dataset.u; save(); render(); break;
    case 'theme': setTheme(document.documentElement.dataset.theme==='light'?'dark':'light'); render(); break;
    case 'equip': {
      const key=el.dataset.k, on=S.equipment[key]!==false;
      S.equipment[key]=!on; save(); render(); break;
    }
    case 'lib-tab': LIB.tab=el.dataset.t; paintLibFull(); break;
    case 'lib-muscle': LIB.muscle=el.dataset.m; paintLibFull(); break;
    case 'lib-clear': LIB.q=''; LIB.muscle=''; paintLibFull(); break;
    case 'open-ex': openExercise(el.dataset.ex); break;
    case 'open-learn': openLearn(+el.dataset.i); break;
    case 'open-swap': openSwap(el.dataset.ex); break;
    case 'summary': openSummary(el.dataset.key||k); break;
    case 'play-vid': {
      const box=el.closest('.thumb-vid'), id=el.dataset.vid;
      if(!box||!id) break;
      box.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0&playsinline=1" title="Exercise video" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer;autoplay;encrypted-media;gyroscope;picture-in-picture" allowfullscreen></iframe>`;
      break;
    }
    case 'start': {
      const dayId=el.dataset.day;
      const s=getSession(k,true,dayId);
      if(!s) break;
      s.dayId=dayId; s.startedAt=Date.now(); s.endedAt=null; s.pausedMs=0; s.pausedAt=null;
      autoSubstitute(s);
      save(); render();
      Lane.sync({count:P[dayId].blocks.length,active:0}); Lane.surge();
      toast('Clock is running.');
      break;
    }
    case 'jump-day': {
      const dayId=el.dataset.day, key=el.dataset.key||k;
      if(key!==k){
        if(S.sessions[key]&&S.sessions[key].endedAt){ openSummary(key); break; }
      }
      const s=getSession(key,true,dayId);
      if(!s) break;
      if(!s.startedAt){ s.dayId=dayId; s.startedAt=Date.now(); autoSubstitute(s); save(); }
      if(location.hash!=='#/today'){ location.hash='#/today'; }
      render(); toast('Showing '+P[dayId].title);
      break;
    }
    case 'step': {
      if(!sess) break;
      const b=currentBlock(sess); if(!b) break;
      const cond0=/min|sec/i.test(String((b||{}).reps||''));
      const d=draftFor(sess,b.ex), f=el.dataset.f, dir=+el.dataset.d;
      const stepW=S.profile.units==='kg'?2.5:5;
      let v=parseFloat(d[f])||0;
      v=f==='w'?Math.max(0,v+dir*stepW):Math.max(0,v+dir);
      d[f]=f==='w'?String(+v.toFixed(1)):String(Math.round(v));
      const inp=$(f==='w'?'inW':'inR'); if(inp) inp.value=cond0&&f==='r'?String(parseFloat(d[f])||''):d[f];
      save();
      break;
    }
    case 'log-set': {
      if(!sess) break;
      const exId=el.dataset.ex, b=blockFor(sess.dayId,exId); if(!b) break;
      const cond0=/min|sec/i.test(String((b||{}).reps||''));
      const d=draftFor(sess,exId);
      const w=cond0?String(d.w||'').slice(0,40):d.w, r=parseFloat(d.r);
      if(cond0){
        if(!(r>0)){ toast('Add the time you did.'); break; }
        const ent=ensureSets(sess,sess.dayId,exId);
        const i=ent.sets.findIndex(s=>!s.done); if(i<0) break;
        ent.sets[i]={w:w,r:String(Math.round(r)),done:true};
        delete sess._draft[exId];
        startRest(b.rest||S.settings.rest);
        save();
        const still=ent.sets.some(s=>!s.done);
        render();
        if(!still){ Lane.surge(); }
        buzz(20);
        toast(w?`Set ${i+1} · ${Math.round(r)} min · ${w}`:`Set ${i+1} · ${Math.round(r)} min done`);
        break;
      }
      const wnum=parseFloat(d.w);
      if(!(r>0)){ toast('Add the reps you did.'); break; }
      const ent=ensureSets(sess,sess.dayId,exId);
      const i=ent.sets.findIndex(s=>!s.done); if(i<0) break;
      ent.sets[i]={w:wnum>0?String(wnum):'',r:String(Math.round(r)),done:true};
      delete sess._draft[exId];
      startRest(b.rest||S.settings.rest);
      save();
      const still=ent.sets.some(s=>!s.done);
      render();
      if(!still){ Lane.surge(); }
      buzz(20);
      toast(wnum>0?`Set ${i+1} · ${wnum} ${S.profile.units} × ${Math.round(r)}`:`Set ${i+1} · ${Math.round(r)} reps`);
      break;
    }
    case 'dock-fold': {
      const dk=$('dock');
      const m=dk.classList.toggle('mini');
      document.body.classList.toggle('dockmini',m);
      const f=dk.querySelector('.dock-fold');
      if(f){ f.setAttribute('aria-expanded',m?'false':'true'); f.setAttribute('aria-label',m?'Expand logger':'Collapse logger'); }
      buzz(8);
      break;
    }
    case 'undo-set': {
      if(!sess) break;
      const ent=sess.entries[el.dataset.ex]; if(!ent) break;
      const i=+el.dataset.i;
      if(ent.sets[i]){ ent.sets[i].done=false; ent.sets[i].w=''; ent.sets[i].r=''; }
      delete sess._draft[el.dataset.ex];
      save(); render(); break;
    }
    case 'skip-ex': {
      if(!sess) break;
      const ent=entryFor(sess,el.dataset.ex);
      ent.skipped=true; delete sess._draft[el.dataset.ex];
      save(); render(); buzz(10); toast('Skipped. Still in the week.');
      break;
    }
    case 'do-swap': {
      if(!sess) break;
      const from=el.dataset.from,to=el.dataset.to,b=blockFor(sess.dayId,from);
      if(b){ b.ex=to; }
      sess.autoSwaps=sess.autoSwaps||[]; sess.autoSwaps.push({from,to});
      closeSheet(); save(); render(); toast('Swapped to '+(EX[to]||ST[to]).name);
      break;
    }
    case 'pause': {
      if(!sess) break;
      if(sess.pausedAt){ sess.pausedMs=(sess.pausedMs||0)+(Date.now()-sess.pausedAt); sess.pausedAt=null; }
      else sess.pausedAt=Date.now();
      save(); render(); break;
    }
    case 'cancel': {
      if(!sess) break;
      if(!confirm('Cancel this session? Sets you already logged are kept.')) break;
      sess.endedAt=Date.now(); save(); render(); toast('Session closed. Sets kept.');
      break;
    }
    case 'finish': {
      const key=el.dataset.key||k, s=S.sessions[key]; if(!s) break;
      s.endedAt=Date.now();
      save(); render(); openSummary(key); toast('Saved.');
      break;
    }
    case 'store-device': {
      store.mode='device'; store.handle=null;
      try{ localStorage.setItem('surge.store',JSON.stringify({mode:'device',savedAt:S&&S.savedAt||0})); }catch(e){}
      save(); render(); toast('Keeping it on this device.');
      break;
    }
    case 'store-pick': { pickFolder(); break; }
    case 'store-write': { writeFolderBackup(true); break; }
    case 'store-protect': {
      persistStorage().then(ok=>{
        toast(ok?'Protected storage is on.':'This browser could not confirm protected storage.');
        if(route()==='you') render();
      });
      break;
    }
    case 'store-forget': {
      store.mode='device'; store.handle=null; store.folderName='';
      try{ localStorage.setItem('surge.store',JSON.stringify({mode:'device',savedAt:S&&S.savedAt||0})); }catch(e){}
      save(); render(); toast('Folder disconnected.');
      break;
    }
    case 'export': {
      const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download=`surge-backup-${todayKey()}.json`;
      a.click(); URL.revokeObjectURL(a.href);
      break;
    }
    case 'mail-backup': {
      try{
        const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
        const f=new File([blob],`surge-backup-${todayKey()}.json`,{type:'application/json'});
        if(navigator.canShare&&navigator.canShare({files:[f]})){
          navigator.share({files:[f],title:'SURGE log'}).catch(()=>{});
        }else{
          const a=document.createElement('a');
          a.href=URL.createObjectURL(blob);
          a.download=`surge-backup-${todayKey()}.json`;
          a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
          toast('File saved. Send it anywhere.');
        }
      }catch(e){ toast('Could not make the file.'); }
      break;
    }
    case 'reset': {
      if(!confirm('Delete everything here? This cannot be undone.')) break;
      S=blank(); save(); render(); toast('Cleared.');
      break;
    }
  }
});
